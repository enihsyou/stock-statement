[project]
name = "stock-statement"
version = "0.1.0"
description = "支持多券商的证券流水历史收益分析"
readme = "README.md"
authors = [
    { name = "九条涼果", email = "enihsyou@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[project.scripts]
stock-statement = "stock_statement.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["TRY004"]
